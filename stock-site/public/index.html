<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制服倉庫存量</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1a1a1a;--mute:#5f5f5f;--line:#e2e2de;--acc:#1f5fbf;--warn:#b42318;--ok:#1d7a46}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{margin:0 0 4px;font-size:20px}
.stats{display:flex;gap:16px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:16px}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input,select,button{font:inherit}
.search{flex:1 1 180px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:12px 16px 120px;max-width:820px;margin:0 auto}
h2{font-size:15px;color:var(--mute);margin:20px 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 14px;margin-bottom:6px}
.row.zero{border-color:#f0b4ae;background:#fff7f6}
.info{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px}
.sz{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;background:#eef2f9;color:#1f3f75;font-size:14px;font-weight:600}
.nt{color:var(--mute);font-size:13px;margin-top:2px;word-break:break-all}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer}
.qty button:active{background:#eee}
.qty input{width:58px;height:44px;text-align:center;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:8px}
.unit{font-size:13px;color:var(--mute);width:22px}
.del{border:none;background:none;color:var(--mute);font-size:13px;cursor:pointer;padding:6px;min-height:44px}
.del.arm{color:var(--warn);font-weight:700}
.zero .qty input{color:var(--warn)}
.msg{padding:12px 16px;color:var(--mute)}
.err{color:var(--warn)}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:20px}
summary{cursor:pointer;font-weight:700;min-height:28px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.form label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
.form input,.form select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
.form .full{grid-column:1/-1}
.primary{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
.saving{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>制服倉庫存量</h1>
  <div class="stats"><span>品項 <b id="sItems">–</b></span><span>總數量 <b id="sQty">–</b></span><span>缺貨 <b id="sZero">–</b></span><span id="status" class="saving"></span></div>
  <div class="tools">
    <label for="q" style="position:absolute;left:-9999px">搜尋</label>
    <input id="q" class="search" type="search" placeholder="搜尋品名或尺寸，例如：保全外套 XL">
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="list"><div class="msg">載入中…</div></div>
  <details id="addBox">
    <summary>新增品項</summary>
    <form class="form" id="addForm">
      <label class="full">品名<input name="name" required></label>
      <label>尺寸<input name="size" placeholder="例如 XL"></label>
      <label>數量<input name="qty" type="number" min="0" value="1" inputmode="numeric"></label>
      <label>單位<input name="unit" value="件"></label>
      <label>位置<select name="loc" id="locSel"></select></label>
      <label class="full">備註<input name="note"></label>
      <button class="primary full" type="submit">加入</button>
    </form>
  </details>
  <details>
    <summary>匯出 / 備份</summary>
    <p class="nt">資料存在這台電腦的瀏覽器裡。換電腦或清除瀏覽器資料前，請先匯出備份。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="chip" id="expCsv">匯出 Excel (CSV)</button>
      <button type="button" class="chip" id="expJson">下載備份</button>
      <label class="chip" style="display:inline-flex;align-items:center">匯入備份<input type="file" id="impJson" accept=".json" style="display:none"></label>
      <button type="button" class="chip del" id="reset">還原成初始盤點數量</button>
    </div>
  </details>
</main>

function setStatus(t,err){const s=$("#status");s.textContent=t||"";s.className=err?"saving err":"saving";}
function load(){try{const s=localStorage.getItem(KEY);if(s){items=JSON.parse(s);return;}}catch(e){}items=JSON.parse(JSON.stringify(SEED));}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));setStatus("已儲存 "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}));}catch(e){setStatus("瀏覽器無法儲存，請記得匯出備份",true);}}
function chips(){
  const c=$("#chips");c.innerHTML="";
  ["全部",...LOCS].forEach(l=>{const b=document.createElement("button");b.className="chip";b.textContent=l;b.setAttribute("aria-pressed",l===filterLoc);b.onclick=()=>{filterLoc=l;chips();render();};c.appendChild(b);});
  $("#locSel").innerHTML=LOCS.map(l=>`<option>${esc(l)}</option>`).join("");
}
function render(){
  $("#sItems").textContent=items.length;
  $("#sQty").textContent=items.reduce((a,it)=>a+(Number(it.qty)||0),0);
  $("#sZero").textContent=items.filter(it=>(Number(it.qty)||0)<=0).length;
  const q=query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const shown=items.filter(it=>(filterLoc==="全部"||it.loc===filterLoc)&&q.every(w=>(it.name+" "+it.size+" "+(it.note||"")).toLowerCase().includes(w)));
  if(!shown.length){$("#list").innerHTML=`<div class="msg">${items.length?"沒有符合的品項":"目前沒有資料"}</div>`;return;}
  let html="";
  LOCS.concat(["其他"]).forEach(loc=>{
    const g=shown.filter(it=>(LOCS.includes(it.loc)?it.loc:"其他")===loc);
    if(!g.length)return;
    html+=`<h2>${esc(loc)}（${g.length}）</h2>`;
    g.forEach(it=>{const n=Number(it.qty)||0;
      html+=`<div class="row${n<=0?" zero":""}" data-id="${esc(it.id)}">
        <div class="info"><div class="nm">${esc(it.name)}${it.size?`<span class="sz">${esc(it.size)}</span>`:""}</div>${it.note?`<div class="nt">${esc(it.note)}</div>`:""}</div>
        <div class="qty">
          <button type="button" data-act="dec" aria-label="減少 ${esc(it.name)} ${esc(it.size)}">−</button>
          <input type="number" min="0" inputmode="numeric" value="${n}" aria-label="${esc(it.name)} ${esc(it.size)} 數量">
          <button type="button" data-act="inc" aria-label="增加 ${esc(it.name)} ${esc(it.size)}">＋</button>
          <span class="unit">${esc(it.unit||"件")}</span>
        </div>
        <button type="button" class="del" data-act="del">刪除</button>
      </div>`;});
  });
  $("#list").innerHTML=html;
}
function setQty(id,n){const it=items.find(x=>x.id===id);if(!it)return;it.qty=Math.max(0,Math.floor(Number(n)||0));it.updatedAt=new Date().toISOString();persist();render();}
$("#list").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=b.closest(".row").dataset.id;const it=items.find(x=>x.id===id);if(!it)return;
  if(b.dataset.act==="inc")setQty(id,(Number(it.qty)||0)+1);
  else if(b.dataset.act==="dec")setQty(id,(Number(it.qty)||0)-1);
  else if(b.dataset.act==="del"){
    if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="確定刪除？";setTimeout(()=>{b.classList.remove("arm");b.textContent="刪除";},3000);return;}
    items=items.filter(x=>x.id!==id);persist();render();
  }
});
$("#list").addEventListener("change",e=>{if(e.target.matches(".qty input"))setQty(e.target.closest(".row").dataset.id,e.target.value);});
$("#q").addEventListener("input",e=>{query=e.target.value;render();});
$("#addForm").addEventListener("submit",e=>{
  e.preventDefault();const f=new FormData(e.target);
  const name=f.get("name").trim();if(!name)return;
  items.push({id:"n"+Date.now(),name,size:f.get("size").trim(),qty:Math.max(0,Number(f.get("qty"))||0),unit:f.get("unit").trim()||"件",loc:f.get("loc"),note:f.get("note").trim(),updatedAt:new Date().toISOString()});
  persist();e.target.reset();render();
});
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
const stamp=()=>new Date().toISOString().slice(0,10);
$("#expCsv").onclick=()=>{const rows=[["位置","品名","尺寸","數量","單位","備註"],...items.map(it=>[it.loc,it.name,it.size,it.qty,it.unit,it.note||""])];dl("制服庫存_"+stamp()+".csv","﻿"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv");};
$("#expJson").onclick=()=>dl("制服庫存備份_"+stamp()+".json",JSON.stringify(items,null,1),"application/json");
$("#impJson").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;items=d;persist();render();setStatus("已匯入備份");}catch(err){setStatus("匯入失敗：檔案格式不對",true);}e.target.value="";};
$("#reset").onclick=e=>{const b=e.target;if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="再按一次確認還原";setTimeout(()=>{b.classList.remove("arm");b.textContent="還原成初始盤點數量";},3000);return;}items=JSON.parse(JSON.stringify(SEED));persist();render();};
load();chips();render();
</script>
</body>
</html>
