<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制服倉庫存量</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="/icon-192.png?v=2">

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1a1a1a;font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e2e2de;padding:14px 16px 10px}
h1{margin:0 0 4px;font-size:20px}
.stats{display:flex;gap:16px;color:#5f5f5f;font-size:14px;flex-wrap:wrap}
.stats b{color:#1a1a1a;font-size:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tab{border:1px solid #e2e2de;background:#fff;border-radius:999px;padding:6px 14px;min-height:38px;font:inherit;cursor:pointer;color:#1a1a1a}
.tab[aria-pressed=true]{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.search{flex:1 1 200px;padding:10px 12px;border:1px solid #e2e2de;border-radius:8px;background:#fff;font:inherit}
main{padding:14px 16px 80px;display:grid;grid-template-columns:430px minmax(0,1fr);gap:20px;align-items:start}
@media(min-width:1151px){.listwrap{order:1}.left{order:2}}
.left{min-width:0}
@media(max-width:1150px){main{grid-template-columns:minmax(0,1fr)}}
h2{font-size:17px;margin:4px 0 12px}
.wall{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.cab{flex:1 1 280px;min-width:0}
.cab .nm{font-size:13px;color:#5f5f5f;margin-bottom:4px}
.frame{border:3px solid #111;border-top:none;border-bottom-width:5px;background:#fff}
.lv{display:grid;gap:6px;padding:6px;height:var(--lvh,136px);overflow:hidden;border-bottom:3px solid #111;align-items:start;align-content:start}
.lv:last-child{border-bottom:none}
.slot{display:grid;gap:6px;min-width:0;align-content:start}
.card{background:#fff;border:1px solid #e2e2de;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.dim{opacity:.25}
.card.hit{border:2px solid #1a1a1a}
.lbl{font-size:13px;color:#5f5f5f;padding:4px;grid-column:1/-1}
.t{font-weight:700;font-size:15px;line-height:1.3;word-break:break-all}
.sz{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;background:#eef2f9;color:#1f3f75;font-size:13px;font-weight:600}
.note{color:#5f5f5f;font-size:12px;line-height:1.3}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{flex:0 0 auto;width:34px;height:36px;border-radius:8px;border:1px solid #e2e2de;background:#fff;font-size:20px;line-height:1;cursor:pointer;color:#1a1a1a;padding:0}
.ctl button:active{background:#eee}
.ctl input{flex:1 1 40px;min-width:0;width:48px;height:36px;text-align:center;font-size:17px;font-weight:700;border:1px solid #e2e2de;border-radius:8px;padding:0;-moz-appearance:textfield}
.ctl input::-webkit-inner-spin-button{-webkit-appearance:none}
.qv{font-size:22px;font-weight:700}
.unit{font-size:13px;color:#8a6d3b}
.zero .qv,.zero input{color:#b42318}
details{background:#fff;border:1px solid #e2e2de;border-radius:10px;padding:10px 14px;margin-top:18px}
summary{cursor:pointer;font-weight:700;min-height:28px}
.log{font-size:13px;line-height:1.8;max-height:260px;overflow:auto;margin-top:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{font-size:12px;margin-left:auto}
.multi .card{padding:6px 6px}
.multi .ctl{gap:2px}
.multi .ctl button{width:26px;height:32px;font-size:16px}
.multi .ctl input{min-width:30px;height:32px;font-size:15px}
.multi .t{font-size:14px}

.card .ctl{flex-wrap:wrap}
.ctl .qv{margin-right:2px}
.pm{margin-left:0}
.pm{display:inline-flex;flex-direction:column;gap:2px;margin-left:4px}
.pm button{width:30px;height:20px;border:1px solid #e2e2de;border-radius:6px;background:#fff;font-size:14px;line-height:1;cursor:pointer;color:#1a1a1a;padding:0}
.pm button:active{background:#eee}
input.amt{flex:1 1 52px;min-width:52px;max-width:96px;width:52px;height:42px;border:1px solid #e2e2de;border-radius:8px;text-align:center;font-size:14px;padding:0 4px;-moz-appearance:textfield}
input.amt::-webkit-inner-spin-button,.rq input::-webkit-inner-spin-button{-webkit-appearance:none}
.multi .card{padding:6px}
.multi .t{font-size:14px}
.multi .qv{font-size:18px}
.multi input.amt{min-width:44px;height:38px;font-size:12px}
.multi .pm button{width:24px;height:18px}
.listwrap{margin:0;min-width:0}
@media(min-width:1151px){.listwrap{position:sticky;top:var(--hh,190px);max-height:calc(100vh - var(--hh,190px) - 10px);overflow:auto;padding-right:4px}}
.listwrap h2{margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border:1px solid #e2e2de;background:#fff;border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font:inherit}
.chip[aria-pressed=true]{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
h3{font-size:15px;color:#5f5f5f;margin:20px 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e2de;border-radius:10px;padding:10px 10px 10px 14px;margin-bottom:6px}
.row .info{flex:1;min-width:0}
.rn{font-weight:700;font-size:16px}
.rq{display:flex;align-items:center;gap:4px}
.rq button{width:44px;height:44px;border-radius:8px;border:1px solid #e2e2de;background:#fff;font-size:22px;line-height:1;cursor:pointer;color:#1a1a1a}
.rq input{width:58px;height:44px;text-align:center;font-size:18px;font-weight:700;border:1px solid #e2e2de;border-radius:8px;-moz-appearance:textfield}
.rq .unit{width:22px}
.del{border:none;background:none;color:#5f5f5f;font-size:13px;cursor:pointer;padding:6px;min-height:44px}
.del.arm{color:#b42318;font-weight:700}
.row.zero{border-color:#f0b4ae;background:#fff7f6}
.msg{padding:12px;color:#5f5f5f}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.form label{display:flex;flex-direction:column;font-size:13px;color:#5f5f5f;gap:4px}
.form input,.form select{padding:9px 10px;border:1px solid #e2e2de;border-radius:8px;font:inherit;background:#fff}
.form .full{grid-column:1/-1}
.primary{background:#1f5fbf;color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;cursor:pointer;font:inherit}

.lv.fs1 .card{padding:5px 6px;gap:3px}.lv.fs1 .t{font-size:13px}.lv.fs1 .qv{font-size:18px}.lv.fs1 .note{display:none}.lv.fs1 input.amt{height:32px}
.lv.fs2 .card{padding:4px 5px;gap:2px}.lv.fs2 .t{font-size:12px}.lv.fs2 .sz{font-size:11px;padding:0 5px}.lv.fs2 .unit{font-size:11px}.lv.fs2 .qv{font-size:16px}.lv.fs2 .note{display:none}.lv.fs2 input.amt{height:26px;font-size:12px;min-width:40px}.lv.fs2 .pm button{height:14px;width:22px;font-size:11px}
.lv.fs3 .card{padding:3px 4px;gap:1px;border-radius:6px}.lv.fs3 .t{font-size:11px}.lv.fs3 .sz{font-size:10px;padding:0 4px;margin-left:3px}.lv.fs3 .unit{font-size:10px}.lv.fs3 .qv{font-size:14px}.lv.fs3 .note{display:none}.lv.fs3 input.amt{height:22px;font-size:11px;min-width:34px}.lv.fs3 .pm button{height:11px;width:20px;font-size:10px}.lv.fs3 .slot{gap:3px}.lv.fs3{gap:3px}

.wh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.wh h2{margin:0}
body.nocab #cabArea,body.nocab #wallName,body.nocab #tabs{display:none}
@media(min-width:1151px){body.nocab main{grid-template-columns:minmax(0,820px) minmax(0,1fr)}body.nocab .listwrap{position:static;max-height:none}}
body.ro .pm,body.ro input.amt,body.ro .rq button,body.ro .del,body.ro #addBox,body.ro label[for=who],body.ro #who{display:none}
body.ro .rq input{border-color:transparent;background:transparent;pointer-events:none}
body.ro .ro-tag{display:inline}.ro-tag{display:none;font-size:13px;font-weight:400;color:#5f5f5f;margin-left:6px}
</style>
</head>
<body class="nocab">
<header>
  <h1>制服倉庫存量<span class="ro-tag">（查看用，不能修改）</span></h1>
  <div class="stats"><span>總數量 <b id="sQty">–</b></span><span>品項 <b id="sItems">–</b></span><span>缺貨 <b id="sZero">–</b></span><span class="st" id="status"></span></div>
  <div class="bar" id="tabs"></div>
  <div class="bar"><label for="q" style="position:absolute;left:-9999px">搜尋</label><input id="q" class="search" type="search" placeholder="搜尋品名或尺寸，例如：保全外套 XL"></div>
</header>
<div id="codeBox" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:9;align-items:center;justify-content:center"><form id="codeForm" style="border:1px solid #000;padding:20px;background:#fff;display:flex;flex-direction:column;gap:10px;min-width:260px"><label for="codeIn"><b>請輸入通行碼</b></label><input id="codeIn" class="search" autocomplete="off"><span id="codeMsg" style="font-size:13px"></span><button class="tab" type="submit">確定</button><a href="/" style="font-size:13px;color:#000">只要查看，回查看版</a></form></div>
<main>
<div class="left">
  <div class="wh"><h2 id="wallName"></h2><button type="button" class="tab" id="toggleCab" aria-pressed="false">顯示櫃位圖</button></div>
  <div id="cabArea">
  <div class="wall" id="wall"></div>
  </div>
  
  
</div>
<section class="listwrap">
    <h2>動態表</h2>
    <div class="chips" id="lchips"></div>
    <div id="list"></div>
    <details id="addBox">
      <summary>新增品項</summary>
      <form class="form" id="addForm">
        <label class="full">品名<input name="name" required></label>
        <label>尺寸<input name="size" placeholder="例如 XL"></label>
        <label>數量<input name="qty" type="number" min="0" value="1" inputmode="numeric"></label>
        <label>單位<input name="unit" value="件"></label>
        <label>位置<select name="loc" id="locSel"></select></label>
        <label class="full">備註<input name="note"></label>
        <button class="primary full" type="submit">加入</button>
      </form>
    </details>
  <details>
    <summary>最近異動</summary>
    <div class="log" id="log"></div>
  </details>
  <details>
    <summary>匯出</summary>
    <p class="note">數量欄可以直接打 +1、-3 再按 Enter；或打數字後按 ＋／−。所有人看到的是同一份數量，每次加減都會記在「最近異動」。</p>
    <div class="tools"><button type="button" class="tab" id="expCsv">匯出 Excel (CSV)</button></div>
  </details>
</section>
</main>

  const all=Object.values(ITEMS);
  const shown=all.filter(it=>(listLoc==="全部"||it.loc===listLoc)&&hitIt(it)!==false);
  if(!loaded){$("#list").innerHTML='<div class="msg">載入中…</div>';return;}
  if(!shown.length){$("#list").innerHTML='<div class="msg">沒有符合的品項</div>';return;}
  let html="";
  LOCS.forEach(loc=>{const g=shown.filter(it=>it.loc===loc);if(!g.length)return;
    html+=`<h3>${esc(loc)}（${g.length}）</h3>`;
    g.forEach(it=>{const n=qty[it.id]||0;
      html+=`<div class="row${n<=0?" zero":""}" data-id="${esc(it.id)}">
        <div class="info"><div class="rn">${esc(it.name)}${it.size?`<span class="sz">${esc(it.size)}</span>`:""}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:""}</div>
        <div class="rq"><button type="button" data-id="${esc(it.id)}" data-d="-1" aria-label="減少 ${esc(label(it))}">−</button><input type="text" inputmode="text" autocomplete="off" ${RO?"readonly tabindex=\"-1\"":""} data-set="${esc(it.id)}" value="${n}" aria-label="${esc(label(it))} 數量"><button type="button" data-id="${esc(it.id)}" data-d="1" aria-label="增加 ${esc(label(it))}">＋</button><span class="unit">${esc(it.unit||"件")}</span></div>
        <button type="button" class="del" data-del="${esc(it.id)}">刪除</button></div>`;});
  });
  $("#list").innerHTML=html;
}
function renderLog(){$("#log").innerHTML=log.length?log.map(e=>{const it=ITEMS[e.item_id]||BASE[e.item_id];const what=it?(it.wall+"・"+(it.sec||"")+"　"+label(it)):e.item_id;const t=new Date(e.ts).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});return `${esc(t)}　${esc(what)}　${e.d>0?"+":""}${e.d} → ${e.n}`;}).join("<br>"):"還沒有異動";}
function parseQ(v){v=String(v||"").trim().replace(/＋/g,"+").replace(/[－−—]/g,"-").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\s+/g,"");
  if(/^[+-]\d+$/.test(v))return {d:Number(v)};if(/^\d+$/.test(v))return {n:Number(v)};return v?{bad:true}:{};}
function who(){return "";}
async function adjust(id,d){if(RO)return;
  const it=ITEMS[id];if(!it||!loaded)return;
  const cur=qty[id]||0;if(d<0&&cur+d<0){setStatus(label(it)+" 只剩 "+cur+"，不能減 "+(-d));return;}
  qty[id]=cur+d;busy++;render();setStatus("儲存中…");
  try{const j=await api("/api/adjust",{id,d,who:who()});qty[id]=j.n;setStatus("已儲存："+label(it)+" "+(d>0?"+":"")+d+" → "+j.n);}
  catch(err){qty[id]=cur;setStatus("沒存到："+err.message);}
  busy--;render();refresh();
}
async function setQ(id,n){if(RO)return;
  const it=ITEMS[id],old=qty[id]||0;n=Math.max(0,Math.floor(Number(n)||0));if(n===old){render();return;}
  qty[id]=n;busy++;setStatus("儲存中…");
  try{const j=await api("/api/set",{id,n,who:who()});qty[id]=j.n;setStatus("已儲存："+label(it)+" → "+j.n);}
  catch(err){qty[id]=old;setStatus("沒存到："+err.message);}
  busy--;render();refresh();
}
$("#wall").addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(!b)return;
  const id=b.dataset.id,p=parseQ(AMT[id]);const a=p.n?p.n:(p.d?Math.abs(p.d):1);
  adjust(id,Number(b.dataset.d)*a);});
function applyAmt(inp){const id=inp.dataset.amt,p=parseQ(inp.value);
  if(p.d){AMT[id]="";inp.value="";adjust(id,p.d);}else if(p.bad){setStatus("請輸入像 +1、-3 這樣的數字");}}
$("#wall").addEventListener("input",e=>{if(e.target.matches("input.amt"))AMT[e.target.dataset.amt]=e.target.value;});
$("#wall").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input.amt")){e.preventDefault();applyAmt(e.target);}});
$("#wall").addEventListener("change",e=>{if(e.target.matches("input.amt"))applyAmt(e.target);});
$("#list").addEventListener("click",async e=>{if(RO)return;
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.id){adjust(b.dataset.id,Number(b.dataset.d));return;}
  if(b.dataset.del){const id=b.dataset.del;
    if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="確定刪除？";setTimeout(()=>{b.classList.remove("arm");b.textContent="刪除";},3000);return;}
    busy++;try{await api("/api/delete",{id,who:who()});setStatus("已刪除："+label(ITEMS[id]));}catch(err){setStatus("刪除失敗："+err.message);}busy--;refresh();}
});
function applySet(inp){const id=inp.dataset.set,p=parseQ(inp.value);
  if(p.d)adjust(id,p.d);else if(p.n!==undefined)setQ(id,p.n);else{setStatus("請輸入數字，或 +1、-1");render();}}
$("#list").addEventListener("change",e=>{if(e.target.matches("input[data-set]"))applySet(e.target);});
$("#list").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input[data-set]")){e.preventDefault();e.target.blur();}});
$("#q").addEventListener("input",e=>{query=e.target.value.trim();
  if(query){const hit=LAYOUT.find(w=>w.sections.some(s=>s.rows.some(r=>r.some(c=>c.items.some(it=>ITEMS[it.id]&&hitIt(it))))));if(hit&&hit.id!==wallId){wallId=hit.id;tabs();}}
  render();});
$("#addForm").addEventListener("submit",async e=>{e.preventDefault();if(RO)return;const f=new FormData(e.target);
  const d={name:f.get("name").trim(),size:f.get("size").trim(),qty:Math.max(0,Number(f.get("qty"))||0),unit:f.get("unit").trim()||"件",loc:f.get("loc"),note:f.get("note").trim(),who:who()};
  if(!d.name)return;busy++;try{await api("/api/add",d);e.target.reset();setStatus("已新增："+d.name);}catch(err){setStatus("新增失敗："+err.message);}busy--;refresh();});
$("#locSel").innerHTML=LOCS.map(l=>`<option>${esc(l)}</option>`).join("");
$("#codeForm").addEventListener("submit",async e=>{e.preventDefault();ls.set("stock-code",$("#codeIn").value.trim());
  try{await api("/api/check",{});$("#codeBox").style.display="none";$("#codeMsg").textContent="";setStatus("通行碼正確");}
  catch(err){$("#codeMsg").textContent=err.message;askCode();}});
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
$("#expCsv").onclick=()=>{const rows=[["櫃面","區","品名","尺寸","數量","單位","備註"],...Object.values(ITEMS).map(it=>[it.wall,it.sec,it.name,it.size,qty[it.id]||0,it.unit,it.note])];dl("制服庫存_"+new Date().toISOString().slice(0,10)+".csv","﻿"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv");};
function setCab(off){document.body.classList.toggle("nocab",off);const b=$("#toggleCab");b.textContent=off?"顯示櫃位圖":"關閉櫃位圖";b.setAttribute("aria-pressed",!off);ls.set("stock-cab",off?"":"1");hh();if(!off)fit();}
$("#toggleCab").onclick=()=>setCab(!document.body.classList.contains("nocab"));
ITEMS=Object.assign({},BASE);tabs();hh();render();setCab(ls.get("stock-cab")!=="1");refresh();
setInterval(()=>{if(document.visibilityState==="visible")refresh();},10000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
