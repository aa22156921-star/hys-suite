<html lang="zh-Hant">
<head>

<title>制服倉庫存量</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #000;padding:12px 14px 10px}
h1{margin:0;font-size:20px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:4px}
.stats b{font-size:16px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tab{border:1px solid #000;background:#fff;color:#000;padding:7px 12px;min-height:40px;font:inherit;cursor:pointer}
.tab[aria-pressed=true]{background:#000;color:#fff}
.search{flex:1 1 200px;padding:9px 10px;border:1px solid #000;font:inherit;min-height:40px}
main{padding:14px}
h2{font-size:18px;margin:0 0 10px}
.wall{display:flex;flex-wrap:wrap;align-items:stretch}
.sec{flex:1 1 300px;display:flex;flex-direction:column;min-width:0}
.sec .nm{font-size:12px;padding:2px 0}
.grid{display:grid;flex:1;grid-auto-rows:minmax(86px,auto);border-top:1px solid #000;border-left:1px solid #000}
.cell{border-right:1px solid #000;border-bottom:1px solid #000;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cell.dim{opacity:.25}
.cell.hit{outline:3px solid #000;outline-offset:-3px}
.lbl{font-size:13px}
.it{display:flex;flex-direction:column;gap:3px}
.it+.it{border-top:1px dashed #999;padding-top:5px}
.t{font-weight:700;font-size:15px;line-height:1.25;word-break:break-all}
.t .sz{font-weight:700;margin-left:4px}
.note{font-size:12px;line-height:1.3}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{flex:0 0 auto;width:44px;height:36px;border:1px solid #000;background:#fff;color:#000;font:700 15px/1 inherit;cursor:pointer}
.ctl button:active{background:#000;color:#fff}
.q{flex:1;text-align:center;font-size:22px;font-weight:700;min-width:36px}
.q small{font-size:12px;font-weight:400;margin-left:2px}
.zero .q{text-decoration:line-through}
.zero .t::after{content:"　缺貨";font-size:12px;font-weight:400}
details{border:1px solid #000;padding:10px 12px;margin-top:16px}
summary{cursor:pointer;font-weight:700;min-height:28px}
.log{font-size:13px;line-height:1.7;max-height:260px;overflow:auto;margin-top:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{font-size:12px;margin-left:auto}
@media print{header .bar,.ctl button,details{display:none}}
</style>
</head>

<header>

</header>
<div id="codeBox" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:9;align-items:center;justify-content:center"><form id="codeForm" style="border:1px solid #000;padding:20px;background:#fff;display:flex;flex-direction:column;gap:10px;min-width:260px"><label for="codeIn"><b>請輸入通行碼</b></label><input id="codeIn" class="search" autocomplete="off"><button class="tab" type="submit">確定</button></form></div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ITEMS={};
LAYOUT.forEach(w=>w.sections.forEach(s=>s.rows.forEach(r=>r.forEach(c=>c.items.forEach(it=>{ITEMS[it.id]=Object.assign({},it,{wall:w.name,sec:s.name});})))));
let qty={}, log=[], wallId=LAYOUT[0].id, query="", loaded=false, busy=0;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
wallId=ls.get("stock-wall")||wallId; $("#who").value=ls.get("stock-who")||"";
$("#who").addEventListener("change",e=>ls.set("stock-who",e.target.value.trim()));
function code(){return ls.get("stock-code")||"";}
function setStatus(t){$("#status").textContent=t;}
async function api(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Code":encodeURIComponent(code())},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  if(r.status===401){askCode();throw new Error("需要通行碼");}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("錯誤 "+r.status));return j;}
function askCode(){$("#codeBox").style.display="flex";}
async function refresh(){
  if(busy)return;
  try{const j=await api("/api/state");qty=j.qty||{};log=j.log||[];loaded=true;setStatus("已同步 "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));render();}
  catch(e){setStatus("連線失敗："+e.message);}
}
function label(it){return it.name+(it.size?" "+it.size:"");}
function stats(){const ids=Object.keys(ITEMS);$("#sQty").textContent=loaded?ids.reduce((a,id)=>a+(qty[id]||0),0):"–";$("#sItems").textContent=ids.length;$("#sZero").textContent=loaded?ids.filter(id=>(qty[id]||0)<=0).length:"–";}
function tabs(){const t=$("#tabs");t.innerHTML="";LAYOUT.forEach(w=>{const b=document.createElement("button");b.className="tab";b.textContent=w.name;b.setAttribute("aria-pressed",w.id===wallId);b.onclick=()=>{wallId=w.id;ls.set("stock-wall",wallId);tabs();render();};t.appendChild(b);});}
function matches(c){if(!query)return null;const ws=query.toLowerCase().split(/\s+/).filter(Boolean);return c.items.some(it=>ws.every(w=>(it.name+" "+it.size+" "+it.note).toLowerCase().includes(w)));}
function render(){
  const w=LAYOUT.find(x=>x.id===wallId)||LAYOUT[0];
  $("#wallName").textContent=w.name;
  let h="";
  w.sections.forEach(s=>{
    h+=`<div class="sec"><div class="nm">${esc(s.name)}</div><div class="grid" style="grid-template-columns:repeat(${s.cols},minmax(0,1fr))">`;
    s.rows.forEach(r=>r.forEach(c=>{
      const m=matches(c);
      h+=`<div class="cell${m===false?" dim":""}${m?" hit":""}" style="grid-column:span ${c.span}">`;
      if(c.label)h+=`<div class="lbl">${esc(c.label)}</div>`;
      c.items.forEach(it=>{const n=qty[it.id]||0;
        h+=`<div class="it${loaded&&n<=0?" zero":""}"><div class="t">${esc(it.name)}${it.size?`<span class="sz">${esc(it.size)}</span>`:""}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:""}
        <div class="ctl"><button type="button" data-id="${esc(it.id)}" data-d="-1" aria-label="${esc(label(it))} 減一">−1</button><span class="q">${loaded?n:"…"}<small>${esc(it.unit)}</small></span><button type="button" data-id="${esc(it.id)}" data-d="1" aria-label="${esc(label(it))} 加一">+1</button></div></div>`;});
      h+=`</div>`;}));
    h+=`</div></div>`;
  });
  $("#wall").innerHTML=h; stats(); renderLog();
}
function renderLog(){$("#log").innerHTML=log.length?log.map(e=>{const it=ITEMS[e.item_id];const what=it?it.wall+"・"+it.sec+"　"+label(it):e.item_id;const t=new Date(e.ts).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});return `${esc(t)}　${esc(e.who||"未署名")}　${esc(what)}　${e.d>0?"+":""}${e.d} → ${e.n}`;}).join("<br>"):"還沒有異動";}
$("#wall").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-id]");if(!b||!loaded)return;
  const id=b.dataset.id,d=Number(b.dataset.d),it=ITEMS[id];
  if(d<0&&(qty[id]||0)<=0){setStatus(label(it)+" 已經是 0");return;}
  const who=$("#who").value.trim();ls.set("stock-who",who);
  qty[id]=(qty[id]||0)+d;busy++;render();setStatus("儲存中…");
  try{const j=await api("/api/adjust",{id,d,who});qty[id]=j.n;setStatus("已儲存："+label(it)+" "+(d>0?"+1":"−1")+" → "+j.n);}
  catch(err){qty[id]-=d;setStatus("沒存到："+err.message);}
  busy--;render();refresh();
});
$("#q").addEventListener("input",e=>{query=e.target.value.trim();
  if(query){const hit=LAYOUT.find(w=>w.sections.some(s=>s.rows.some(r=>r.some(c=>matches(c)))));if(hit&&hit.id!==wallId){wallId=hit.id;tabs();}}
  render();});
$("#codeForm").addEventListener("submit",e=>{e.preventDefault();ls.set("stock-code",$("#codeIn").value.trim());$("#codeBox").style.display="none";refresh();});
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
$("#expCsv").onclick=()=>{const rows=[["櫃面","區","品名","尺寸","數量","單位","備註"],...Object.values(ITEMS).map(it=>[it.wall,it.sec,it.name,it.size,qty[it.id]||0,it.unit,it.note])];dl("制服庫存_"+new Date().toISOString().slice(0,10)+".csv","﻿"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv");};
tabs();render();refresh();
setInterval(()=>{if(document.visibilityState==="visible")refresh();},10000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh();});
</script>
